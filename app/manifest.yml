# Relay — commitment operations for Jira Service Management.
#
# The enforcement design is the conclusion of the customer-transition
# investigation (phase0/CUSTOMER-TRANSITION-VALIDATION-REPORT.md, decision B):
#   * a workflow VALIDATOR guards agent and REST closure, and can explain itself;
#   * a workflow CONDITION guards the CUSTOMER PORTAL, because the portal skips
#     validators — proven live: the same transition refused an agent and admitted
#     a customer (c3-3 vs c3-7), and a condition then closed that path (c3-11).
#   * the condition is expression-only, so it reads a projection Relay writes
#     onto the issue. It cannot call Relay, and it cannot say why.

modules:
  # The closure field. Declared here so the app owns it: Forge creates a single
  # locked field instance at deploy time, read-only for users and for the Edit
  # Issue API. The app writes it through
  # PUT /rest/api/3/app/field/{fieldIdOrKey}/value, which only the owning app can
  # call. Its type id is
  #   ari:cloud:ecosystem::extension/{appId}/{environmentId}/static/relay-closure-count
  # and Relay derives that from the invocation context rather than being told.
  jira:customField:
    - key: relay-closure-count
      name: Relay open commitments
      description: Relay's internal closure projection: the number of unresolved commitments on this issue. Read-only, written only by Relay. A workflow condition reads it to withhold closure.
      type: number
      readOnly: true

  jira:globalPage:
    - key: relay-workspace
      title: Relay
      resource: relay-ui
      resolver:
        function: relay-resolver

  jira:issuePanel:
    - key: relay-case-panel
      title: Commitments
      resource: relay-ui
      resolver:
        function: relay-resolver

  jira:workflowValidator:
    - key: relay-closure-validator
      name: Relay closure gate
      description: Blocks closure while accepted commitments remain unresolved.
      function: relay-validator
      projectTypes:
        - company-managed

  # Customer portal coverage.
  #
  # The condition reads the app's own read-only number field (jira:customField
  # below). The field id Jira assigns is generated per app and environment, so
  # the expression cannot be written at build time. Relay resolves the id at
  # runtime (relay.field.resolve), and the console prints the exact line to put
  # here. Until it is replaced, the expression names a field that does not
  # exist: Jira treats an expression error as false, so every state short of a
  # confirmed zero refuses the transition.
  jira:workflowCondition:
    - key: relay-closure-condition
      name: Relay closure readiness
      description: Offers the closure transition only when Relay holds no unresolved commitments.
      expression: "issue.customfield_relay_closure_count == 0"
      projectTypes:
        - company-managed

function:
  - key: relay-resolver
    handler: index.handler
  - key: relay-validator
    handler: index.closureValidator

resources:
  - key: relay-ui
    path: static/relay

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    # The person picker and assignable-user search are read:jira-user.
    - read:jira-user
    # Writing the app's own read-only field. Documented as optional today and
    # planned to become required for the private app-field API.
    - write:app-data:jira

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
